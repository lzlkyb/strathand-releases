name: 💡 功能建议
description: 希望策手增加或改进某个功能。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下希望有这个功能？想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 如果由你来设计，这个功能大概长什么样、怎么用？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 现有替代
      description: 现在没有这个功能时你是怎么应对的？有没有用过更好的做法？
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息（选填）
    validations:
      required: false
